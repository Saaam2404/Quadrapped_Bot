controller_manager:
  ros__parameters:
    update_rate: 50
    use_sim_time: true

    # --- 1. Define the Joint State Broadcaster ---
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # --- 2. Define ONE Controller for the whole body ---
    forward_position_controller:
      type: position_controllers/JointGroupPositionController

# --- 3. Configure the Joint State Broadcaster ---
joint_state_broadcaster:
  ros__parameters:
    # This block must exist, even if empty, but let's add a dummy param to be safe
    extra_param: false

# --- 4. Configure the Whole Body Controller ---
forward_position_controller:
  ros__parameters:
    interface_name: position
    joints:
      # Front Left Leg
      - servoroterf1
      - upperlegf1
      - lowerlegf1

      # Front Right Leg
      - servoroterf2
      - upperlegf2
      - lowerlegf2

      # Rear Left Leg
      - servoroter1
      - upperlegb1
      - lowerlegb1

      # Rear Right Leg
      - servoroterb2
      - upperlegb2
      - lowerlegb2

    gains:
      # ---- HIP / SERVO (soft) ----
      servoroterf1: {p: 4.0, i: 0.0, d: 8.0}
      servoroterf2: {p: 4.0, i: 0.0, d: 8.0}
      servoroter1:  {p: 4.0, i: 0.0, d: 8.0}
      servoroterb2: {p: 4.0, i: 0.0, d: 8.0}

      # ---- THIGH (medium) ----
      upperlegf1:   {p: 8.0, i: 0.0, d: 15.0}
      upperlegf2:   {p: 8.0, i: 0.0, d: 15.0}
      upperlegb1:   {p: 9.0, i: 0.0, d: 18.0}
      upperlegb2:   {p: 9.0, i: 0.0, d: 18.0}

      # ---- KNEE (stiff, load-bearing) ----
      lowerlegf1:   {p: 25.0, i: 0.0, d: 30.0}
      lowerlegf2:   {p: 25.0, i: 0.0, d: 30.0}
      lowerlegb1:   {p: 30.0, i: 0.0, d: 35.0}
      lowerlegb2:   {p: 30.0, i: 0.0, d: 35.0}
